  <path d="M 355 85 C 355 145, 155 145, 155 90" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="4,4" marker-end="url(#cycleArrow)"/>
  <text x="255" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#ef4444" text-anchor="middle">cycle connects to index 1 (node 2)</text>

