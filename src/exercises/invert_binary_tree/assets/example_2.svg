<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="400" height="180">
<rect width="100%" height="100%" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <line x1="90" y1="50" x2="50" y2="105" stroke="#94a3b8" stroke-width="2"/>
  <line x1="90" y1="50" x2="130" y2="105" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="90" cy="50" r="16" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
  <text x="90" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <circle cx="50" cy="105" r="16" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
  <text x="50" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <circle cx="130" cy="105" r="16" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
  <text x="130" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>

  <g transform="translate(180, 75)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#6366f1" stroke-width="3" stroke-linecap="round"/>
    <polygon points="35,-6 45,0 35,6" fill="#6366f1"/>
  </g>

  <line x1="310" y1="50" x2="270" y2="105" stroke="#94a3b8" stroke-width="2"/>
  <line x1="310" y1="50" x2="350" y2="105" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="310" cy="50" r="16" fill="#10b981" stroke="#047857" stroke-width="2"/>
  <text x="310" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <circle cx="270" cy="105" r="16" fill="#10b981" stroke="#047857" stroke-width="2"/>
  <text x="270" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <circle cx="350" cy="105" r="16" fill="#10b981" stroke="#047857" stroke-width="2"/>
  <text x="350" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>

  <text x="200" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">[2, 1, 3] -> [2, 3, 1]</text>

